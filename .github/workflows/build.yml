name: Build ProjectNERV

on:
  workflow_dispatch:
  push:
    branches:
      - 'fifteen'

jobs:
  warmup-cache:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false
          
      - name: Fetch submodules (without recursive to prevent errors)
        run: |
          git rm --cached -f target/a53x/patches/vendor || true
          git rm --cached -f target/m34x/patches/vendor || true
          git rm --cached -f external/samloader || true
          # INICIALIZA SEM O --recursive
          git submodule update --init
          
      - name: Set up environment
        run: |
          sudo apt update
          sudo apt install -yq p7zip-full jq attr ccache clang ffmpeg golang libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev libzstd-dev lld protobuf-compiler pcre2-utils webp curl xxd patchelf flex bison lz4 libarchive-tools build-essential python3.12-venv device-tree-compiler android-sdk-libsparse-utils adb fastboot
          
      - name: Install Rust and Samloader
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          cargo install samloader
          mkdir -p out/tools/venv/bin
          ln -sf $HOME/.cargo/bin/samloader out/tools/venv/bin/samloader

  build:
    runs-on: ubuntu-24.04
    needs: warmup-cache
    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false
          
      - name: Fetch submodules (without recursive)
        run: |
          git rm --cached -f target/a53x/patches/vendor || true
          git rm --cached -f target/m34x/patches/vendor || true
          git rm --cached -f external/samloader || true
          git submodule update --init
          
      - name: Set up env
        run: |
          sudo apt install -yq p7zip-full jq attr ccache clang ffmpeg golang libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev libzstd-dev lld protobuf-compiler pcre2-utils webp curl xxd patchelf flex bison lz4 libarchive-tools build-essential python3.12-venv device-tree-compiler android-sdk-libsparse-utils adb fastboot
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          mkdir -p out/tools/venv/bin
          ln -sf $HOME/.cargo/bin/samloader out/tools/venv/bin/samloader
          
      - name: Bypass failing tools (Function Short-Circuit)
        run: |
          # Modifica diretamente a declaração original das funções nos scripts
          # Injeta "return 0;" logo na abertura da função para cancelá-la com sucesso imediato
          for file in external/make.sh scripts/build_dependencies.sh; do
            if [ -f "$file" ]; then
              sed -i 's/build_android_tools.*{/build_android_tools() { return 0;/g' "$file"
              sed -i 's/build_samloader.*{/build_samloader() { return 0;/g' "$file"
            fi
          done
          
          # Substitui a instalação do samloader python por sucesso automático
          find . -type f -name "*.sh" -exec sed -i 's/pip3 install \./true/g' {} +
          
          # Cria os links virtuais das ferramentas nativas já instaladas no Ubuntu
          mkdir -p out/tools/linux/x86/bin
          ln -sf $(which simg2img) out/tools/linux/x86/bin/simg2img || true
          ln -sf $(which img2simg) out/tools/linux/x86/bin/img2simg || true
          ln -sf $(which mke2fs) out/tools/linux/x86/bin/mke2fs || true
          ln -sf $(which e2fsdroid) out/tools/linux/x86/bin/e2fsdroid || true
          
      - name: Build dependencies
        run: |
          # Força a configuração da identidade do Git imediatamente antes de rodar o script
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          source ./buildenv.sh ${{ matrix.target }}
          export SKIP_DEPENDENCY_CHECK=1
          ./scripts/build_dependencies.sh

      - name: Download Firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          mkdir -p "$ODIN_DIR/SM-S711B_EUX" "$ODIN_DIR/SM-A528B_BTU"
          export PATH=$PATH:$HOME/.cargo/bin
          
          # Baixa e extrai S23 FE
          samloader download -m "SM-S711B" -r "EUX" -v "S711BXXSAEYI1/S711BOXMAEYI1/S711BXXSAEYI1" -d "$ODIN_DIR/SM-S711B_EUX"
          ZIP_S23=$(find "$ODIN_DIR/SM-S711B_EUX" -maxdepth 1 -name "*.zip" | head -n 1)
          unzip -o "$ZIP_S23" -d "$ODIN_DIR/SM-S711B_EUX" && rm -f "$ZIP_S23"
          echo "S711BXXSAEYI1/S711BOXMAEYI1/S711BXXSAEYI1" > "$ODIN_DIR/SM-S711B_EUX/.downloaded"
          
          # Baixa e extrai A52s
          samloader download -m "SM-A528B" -r "BTU" -v "A528BXXSBGYI3/A528BOXMBGYI3/A528BXXSBGYI3" -d "$ODIN_DIR/SM-A528B_BTU"
          ZIP_A52S=$(find "$ODIN_DIR/SM-A528B_BTU" -maxdepth 1 -name "*.zip" | head -n 1)
          unzip -o "$ZIP_A52S" -d "$ODIN_DIR/SM-A528B_BTU" && rm -f "$ZIP_A52S"
          echo "A528BXXSBGYI3/A528BOXMBGYI3/A528BXXSBGYI3" > "$ODIN_DIR/SM-A528B_BTU/.downloaded"
          
      - name: Extract Firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          export SKIP_DEPENDENCY_CHECK=1
          ./scripts/extract_fw.sh --ignore-target
          ./scripts/extract_fw.sh --ignore-source

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          export SKIP_DEPENDENCY_CHECK=1
          bash ./scripts/make_rom.sh

      - name: Upload
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
             SERVER=$(curl -s "https://api.gofile.io/servers" | jq -r '.data.servers[0].name')
             curl -F "file=@$ZIP_FILE" "https://${SERVER}.gofile.io/contents/uploadfile"
             cp "$ZIP_FILE" ./rom_final.zip
          fi
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROM-A52s
          path: rom_final.zip
