name: Build ProjectNERV

on:
  workflow_dispatch:
  push:
    branches:
      - 'fifteen'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Ajustar Configurações com IMEIs válidos
        run: |
          # Troca referências do S711B para o S23 normal (S911B)
          find . -name "*.sh" -exec sed -i 's/SM-S711B/SM-S911B/g' {} +
          
          # Injeta os IMEIs originais nas configurações para PASSAR na validação do extract_fw.sh
          sed -i 's|SOURCE_FIRMWARE=.*|SOURCE_FIRMWARE="SM-S911B/EUX/352404911234563"|' target/a52sxq/config.sh
          sed -i 's|TARGET_FIRMWARE=.*|TARGET_FIRMWARE="SM-A528B/BTU/352599501234566"|' target/a52sxq/config.sh

      - name: Remover submodules fantasma e inicializar o restante
        run: |
          git rm --cached -f target/a53x/patches/vendor 2>/dev/null || true
          git rm --cached -f target/m34x/patches/vendor 2>/dev/null || true
          git rm --cached -f external/samloader 2>/dev/null || true
          git submodule update --init

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev \
            libpcre2-dev libzstd-dev lld protobuf-compiler \
            curl xxd patchelf flex bison lz4 libarchive-tools \
            build-essential python3 python3-pip python3-venv \
            device-tree-compiler android-sdk-libsparse-utils adb fastboot \
            e2fsprogs webp pcre2-utils

      - name: Instalar Rust e compilar samloader-rs
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          git clone https://github.com/topjohnwu/samloader-rs.git /tmp/samloader-rs
          cd /tmp/samloader-rs
          git checkout 1.2.0
          patch -p3 < "${{ github.workspace }}/patches/samloader-rs/0001-version-select.patch"
          cargo build --release
          cp target/release/samloader $HOME/.cargo/bin/samloader

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Bypass build de ferramentas (CHECK_TOOLS false)
        run: |
          sed -i 's/^ANDROID_TOOLS=true$/ANDROID_TOOLS=false/' scripts/build_dependencies.sh
          sed -i 's/^APKTOOL=true$/APKTOOL=false/'             scripts/build_dependencies.sh
          sed -i 's/^EROFS_UTILS=true$/EROFS_UTILS=false/'     scripts/build_dependencies.sh
          sed -i 's/^IMG2SDAT=true$/IMG2SDAT=false/'           scripts/build_dependencies.sh
          sed -i 's/^MAGISKBOOT=true$/MAGISKBOOT=false/'       scripts/build_dependencies.sh
          sed -i 's/^SAMLOADER=true$/SAMLOADER=false/'        scripts/build_dependencies.sh
          sed -i 's/^SIGNAPK=true$/SIGNAPK=false/'            scripts/build_dependencies.sh

      - name: Criar links de ferramentas e Magiskboot
        run: |
          mkdir -p out/tools/bin out/tools/venv/bin
          ln -sf $(which simg2img) out/tools/bin/simg2img
          ln -sf $(which img2simg) out/tools/bin/img2simg
          ln -sf $(which mke2fs)   out/tools/bin/mke2fs
          ln -sf $(which e2fsdroid) out/tools/bin/e2fsdroid
          
          MAGISK_URL=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest | jq -r '.assets[] | .browser_download_url' | grep "Magisk-v.*\.apk$")
          curl -L -s -o /tmp/magisk.apk "$MAGISK_URL"
          unzip -q -j /tmp/magisk.apk "lib/x86_64/libmagiskboot.so" -d /tmp/
          mv /tmp/libmagiskboot.so out/tools/bin/magiskboot
          chmod +x out/tools/bin/magiskboot
          
          ln -sf $HOME/.cargo/bin/samloader out/tools/venv/bin/samloader

      - name: Build dependencies
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download firmware SOURCE (SM-S911B / S23 - One UI 7)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          SAMLOADER="$HOME/.cargo/bin/samloader"
          DEST="$ODIN_DIR/SM-S911B_EUX"
          mkdir -p "$DEST"
          cd "$DEST"
          
          DOWNLOADED=false
          for VERSION in "S911BXXSAEYI1" "S911BXXSAEXI1" "S911BXXSAEXF1"; do
             echo "Tentando $VERSION..."
             $SAMLOADER download -m "SM-S911B" -r "EUX" -v "$VERSION" && DOWNLOADED=true && break || sleep 5
          done
          
          [ "$DOWNLOADED" != "true" ] && echo "Firmware não encontrado" && exit 1
          
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          unzip -o "$ZIP" && rm -f "$ZIP"
          
          AP=$(find . -name "AP_*.tar.md5" | head -1 | xargs basename)
          CSC=$(find . \( -name "CSC_*.tar.md5" -o -name "HOME_CSC_*.tar.md5" \) | head -1 | xargs basename)
          CP=$(find . -name "CP_*.tar.md5" | head -1 | xargs basename)
          echo "${AP}/${CSC}/${CP}" > ".downloaded"

      - name: Download firmware TARGET (A52s)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          SAMLOADER="$HOME/.cargo/bin/samloader"
          DEST="$ODIN_DIR/SM-A528B_BTU"
          mkdir -p "$DEST"
          cd "$DEST"
          
          $SAMLOADER download -m "SM-A528B" -r "BTU" -v "A528BXXSBGYI3" || $SAMLOADER download -m "SM-A528B" -r "BTU"
          
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          unzip -o "$ZIP" && rm -f "$ZIP"
          
          AP=$(find . -name "AP_*.tar.md5" | head -1 | xargs basename)
          CSC=$(find . \( -name "CSC_*.tar.md5" -o -name "HOME_CSC_*.tar.md5" \) | head -1 | xargs basename)
          CP=$(find . -name "CP_*.tar.md5" | head -1 | xargs basename)
          echo "${AP}/${CSC}/${CP}" > ".downloaded"

      - name: Extract Firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          export SKIP_DEPENDENCY_CHECK=1
          ./scripts/extract_fw.sh --ignore-target
          ./scripts/extract_fw.sh --ignore-source

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          export SKIP_DEPENDENCY_CHECK=1
          bash ./scripts/make_rom.sh

      - name: Upload
        if: always()
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
             SERVER=$(curl -s "https://api.gofile.io/servers" | jq -r '.data.servers[0].name')
             curl -F "file=@${ZIP_FILE}" "https://${SERVER}.gofile.io/contents/uploadfile"
             cp "$ZIP_FILE" ./rom_final.zip
          fi
          
      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROM-A52s
          path: rom_final.zip
