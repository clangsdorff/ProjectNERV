name: Build ProjectNERV

on:
  workflow_dispatch:
  push:
    branches:
      - 'fifteen'

jobs:
  warmup-cache:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up environment
        run: |
          sudo apt update
          sudo apt install -yq p7zip-full jq attr ccache clang ffmpeg golang libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev libzstd-dev lld protobuf-compiler webp curl xxd patchelf flex bison lz4 libarchive-tools build-essential python3.12-venv device-tree-compiler pcre2-utils android-sdk-libsparse-utils
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build samloader-rs (Patch Local)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          git clone https://github.com/topjohnwu/samloader-rs.git /tmp/samloader-rs
          cd /tmp/samloader-rs && git checkout 1.2.0
          patch -p3 < "${{ github.workspace }}/patches/samloader-rs/0001-version-select.patch"
          cargo build --release
          sudo cp target/release/samloader /usr/local/bin/samloader

      - name: Cache samloader-rs binary
        uses: actions/cache/save@v4
        with:
          path: /usr/local/bin/samloader
          key: samloader-v1.2.0-noandroid-v2

  build:
    runs-on: ubuntu-24.04
    needs: warmup-cache
    strategy:
      matrix:
        target: [a52sxq]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore samloader-rs
        uses: actions/cache/restore@v4
        with:
          path: /usr/local/bin/samloader
          key: samloader-v1.2.0-noandroid-v2

      - name: Instalar dependências do sistema
        run: |
          sudo apt update
          sudo apt install -yq webp pcre2-utils android-sdk-libsparse-utils adb fastboot e2fsprogs

      - name: Configurar identidades e links de ferramentas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          mkdir -p out/tools/bin out/tools/venv/bin
          # Linkar ferramentas do sistema para a pasta do NERV
          ln -sf $(which simg2img) out/tools/bin/simg2img
          ln -sf $(which img2simg) out/tools/bin/img2simg
          ln -sf $(which mke2fs)   out/tools/bin/mke2fs
          ln -sf $(which e2fsdroid) out/tools/bin/e2fsdroid
          ln -sf /usr/local/bin/samloader out/tools/venv/bin/samloader
          
          # Magiskboot pré-compilado
          MAGISK_URL=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest | jq -r '.assets[] | .browser_download_url' | grep "Magisk-v.*\.apk$")
          curl -L -s -o /tmp/magisk.apk "$MAGISK_URL"
          unzip -q -j /tmp/magisk.apk "lib/x86_64/libmagiskboot.so" -d /tmp/
          mv /tmp/libmagiskboot.so out/tools/bin/magiskboot
          chmod +x out/tools/bin/magiskboot

      - name: Patch build_dependencies.sh (Forçar Skip)
        run: |
          # Desabilita as flags no script para pular compilações problemáticas
          sed -i 's/^ANDROID_TOOLS=true$/ANDROID_TOOLS=false/' scripts/build_dependencies.sh
          sed -i 's/^APKTOOL=true$/APKTOOL=false/'             scripts/build_dependencies.sh
          sed -i 's/^SIGNAPK=true$/SIGNAPK=false/'             scripts/build_dependencies.sh
          sed -i 's/^SAMLOADER=true$/SAMLOADER=false/'         scripts/build_dependencies.sh
          echo "=== Verificando Flags (Devem estar false) ==="
          grep -E "^(ANDROID_TOOLS|APKTOOL|SIGNAPK|SAMLOADER)=" scripts/build_dependencies.sh

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download firmware SOURCE (SM-S911B - One UI 7)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          DEST="$ODIN_DIR/SM-S911B_EUX"
          mkdir -p "$DEST"
          # S911B (S23) latest firmware
          samloader download -m "SM-S911B" -r "EUX" -d "$DEST"
          ZIP=$(find "$DEST" -maxdepth 1 -name "*.zip" | head -1)
          unzip -o "$ZIP" -d "$DEST" && rm -f "$ZIP"
          AP=$(find "$DEST" -name "AP_*.tar.md5" | head -1 | xargs basename)
          CSC=$(find "$DEST" \( -name "CSC_*.tar.md5" -o -name "HOME_CSC_*.tar.md5" \) | head -1 | xargs basename)
          CP=$(find "$DEST" -name "CP_*.tar.md5" | head -1 | xargs basename)
          echo "${AP}/${CSC}/${CP}" > "$DEST/.downloaded"

      - name: Download firmware TARGET (A52s)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          DEST="$ODIN_DIR/SM-A528B_BTU"
          mkdir -p "$DEST"
          samloader download -m "SM-A528B" -r "BTU" -v "A528BXXSBGYI3" -d "$DEST" || samloader download -m "SM-A528B" -r "BTU" -d "$DEST"
          ZIP=$(find "$DEST" -maxdepth 1 -name "*.zip" | head -1)
          unzip -o "$ZIP" -d "$DEST" && rm -f "$ZIP"
          AP=$(find "$DEST" -name "AP_*.tar.md5" | head -1 | xargs basename)
          CSC=$(find "$DEST" \( -name "CSC_*.tar.md5" -o -name "HOME_CSC_*.tar.md5" \) | head -1 | xargs basename)
          CP=$(find "$DEST" -name "CP_*.tar.md5" | head -1 | xargs basename)
          echo "${AP}/${CSC}/${CP}" > "$DEST/.downloaded"

      - name: Extract and Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          export SKIP_DEPENDENCY_CHECK=1
          export SOURCE_FIRMWARE="SM-S911B/EUX/latest"
          ./scripts/extract_fw.sh
          bash ./scripts/make_rom.sh

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProjectNERV-A52s-OneUI7
          path: out/*.zip
