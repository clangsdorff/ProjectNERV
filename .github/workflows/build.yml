name: Build ProjectNERV

on:
  workflow_dispatch:
  push:
    branches:
      - 'fifteen'

jobs:
  warmup-cache:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch submodules recursively
        run: |
          git rm --cached -f target/a53x/patches/vendor || true
          git rm --cached -f target/m34x/patches/vendor || true
          git rm --cached -f external/samloader || true
          git submodule update --init --recursive
      - name: Set up environment
        run: |
          sudo apt update
          sudo apt install -yq p7zip-full jq attr ccache clang ffmpeg golang libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev libzstd-dev lld protobuf-compiler pcre2-utils pcre2-bin webp curl xxd patchelf flex bison lz4 libarchive-tools build-essential python3.12-venv device-tree-compiler
      - name: Install Rust and Samloader
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          cargo install samloader
          mkdir -p out/tools/venv/bin
          ln -sf $HOME/.cargo/bin/samloader out/tools/venv/bin/samloader
      - name: Bypass Python build
        run: |
          find . -type f -name "*.sh" -exec sed -i 's/pip3 install \./true/g' {} +

  build:
    runs-on: ubuntu-24.04
    needs: warmup-cache
    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch submodules
        run: |
          git rm --cached -f target/a53x/patches/vendor || true
          git rm --cached -f target/m34x/patches/vendor || true
          git rm --cached -f external/samloader || true
          git submodule update --init --recursive
      - name: Set up env
        run: |
          sudo apt install -yq p7zip-full jq attr ccache clang ffmpeg golang libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev libzstd-dev lld protobuf-compiler pcre2-utils pcre2-bin webp curl xxd patchelf flex bison lz4 libarchive-tools build-essential python3.12-venv device-tree-compiler
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          mkdir -p out/tools/venv/bin
          ln -sf $HOME/.cargo/bin/samloader out/tools/venv/bin/samloader
          find . -type f -name "*.sh" -exec sed -i 's/pip3 install \./true/g' {} +
      - name: Download Firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          mkdir -p "$ODIN_DIR/SM-S711B_EUX" "$ODIN_DIR/SM-A528B_BTU"
          export PATH=$PATH:$HOME/.cargo/bin
          samloader download -m "SM-S711B" -r "EUX" -v "S711BXXSAEYI1/S711BOXMAEYI1/S711BXXSAEYI1" -d "$ODIN_DIR/SM-S711B_EUX"
          samloader download -m "SM-A528B" -r "BTU" -v "A528BXXSBGYI3/A528BOXMBGYI3/A528BXXSBGYI3" -d "$ODIN_DIR/SM-A528B_BTU"
          find "$ODIN_DIR" -name "*.zip" -exec unzip -o {} -d {}_extracted \;
      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          export SKIP_DEPENDENCY_CHECK=1
          bash ./scripts/make_rom.sh
      - name: Upload
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
             SERVER=$(curl -s "https://api.gofile.io/servers" | jq -r '.data.servers[0].name')
             curl -F "file=@$ZIP_FILE" "https://${SERVER}.gofile.io/contents/uploadfile"
          fi
          # Também salvar como artefato
          cp "$ZIP_FILE" ./rom_final.zip
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ROM-A52s
          path: rom_final.zip
