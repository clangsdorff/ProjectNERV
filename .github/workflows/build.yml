name: Build ProjectNERV

on:
  workflow_dispatch:
  push:
    branches:
      - 'fifteen'

jobs:
  warmup-cache:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Remover submodules fantasma
        run: |
          git rm --cached -f target/a53x/patches/vendor 2>/dev/null || true
          git rm --cached -f target/m34x/patches/vendor 2>/dev/null || true
          git rm --cached -f external/samloader 2>/dev/null || true
          git submodule update --init

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo docker builder prune -a || true

      - name: Set up build environment
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp pcre2-utils \
            curl xxd patchelf flex bison lz4 libarchive-tools build-essential \
            python3 python3-pip python3-venv device-tree-compiler \
            android-sdk-libsparse-utils adb fastboot e2fsprogs
          sudo modprobe erofs || true
          sudo modprobe f2fs || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore samloader-rs binary
        id: cache-samloader
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/samloader
          key: samloader-rs-patched-v3

      - name: Build samloader-rs (with version selection patch)
        if: steps.cache-samloader.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/topjohnwu/samloader-rs.git /tmp/samloader-rs
          cd /tmp/samloader-rs
          git checkout 1.2.0
          curl -fL \
            "https://raw.githubusercontent.com/clangsdorff/ProjectNERV/paradigm/patches/samloader-rs/0001-version-select.patch" \
            -o /tmp/0001-version-select.patch
          git apply /tmp/0001-version-select.patch
          cargo build --release
          cp target/release/samloader ~/.cargo/bin/samloader

      - name: Save samloader-rs binary
        if: steps.cache-samloader.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cargo/bin/samloader
          key: samloader-rs-patched-v3

      - name: Restore build tools
        id: cache-tools
        uses: actions/cache/restore@v4
        with:
          path: out/tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/build_dependencies.sh') }}

      - name: Patch build_dependencies.sh
        run: |
          sed -i 's/^ANDROID_TOOLS=true$/ANDROID_TOOLS=false/' scripts/build_dependencies.sh
          sed -i 's/^APKTOOL=true$/APKTOOL=false/'             scripts/build_dependencies.sh
          sed -i 's/^SIGNAPK=true$/SIGNAPK=false/'             scripts/build_dependencies.sh
          sed -i 's/^SAMLOADER=true$/SAMLOADER=false/'         scripts/build_dependencies.sh

      - name: Build dependencies
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          source ./buildenv.sh a52sxq
          ./scripts/build_dependencies.sh

      - name: Save build tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/build_dependencies.sh') }}

  build:
    runs-on: ubuntu-24.04
    needs: warmup-cache

    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Remover submodules fantasma
        run: |
          git rm --cached -f target/a53x/patches/vendor 2>/dev/null || true
          git rm --cached -f target/m34x/patches/vendor 2>/dev/null || true
          git rm --cached -f external/samloader 2>/dev/null || true
          git submodule update --init

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo docker builder prune -a || true

      - name: Set up build environment
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp pcre2-utils \
            curl xxd patchelf flex bison lz4 libarchive-tools build-essential \
            python3 python3-pip python3-venv device-tree-compiler \
            android-sdk-libsparse-utils adb fastboot e2fsprogs
          sudo modprobe erofs || true
          sudo modprobe f2fs || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/platform.x509.pem

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore samloader-rs binary
        id: cache-samloader
        uses: actions/cache/restore@v4
        with:
          path: ~/.cargo/bin/samloader
          key: samloader-rs-patched-v3

      - name: Build samloader-rs (if not cached)
        if: steps.cache-samloader.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/topjohnwu/samloader-rs.git /tmp/samloader-rs
          cd /tmp/samloader-rs
          git checkout 1.2.0
          curl -fL \
            "https://raw.githubusercontent.com/clangsdorff/ProjectNERV/paradigm/patches/samloader-rs/0001-version-select.patch" \
            -o /tmp/0001-version-select.patch
          git apply /tmp/0001-version-select.patch
          cargo build --release
          cp target/release/samloader ~/.cargo/bin/samloader

      - name: Garantir samloader no PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore build tools
        id: cache-tools
        uses: actions/cache/restore@v4
        with:
          path: out/tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/build_dependencies.sh') }}

      - name: Patch build_dependencies.sh
        run: |
          sed -i 's/^ANDROID_TOOLS=true$/ANDROID_TOOLS=false/' scripts/build_dependencies.sh
          sed -i 's/^APKTOOL=true$/APKTOOL=false/'             scripts/build_dependencies.sh
          sed -i 's/^SIGNAPK=true$/SIGNAPK=false/'             scripts/build_dependencies.sh
          sed -i 's/^SAMLOADER=true$/SAMLOADER=false/'         scripts/build_dependencies.sh

      - name: Build dependencies (if not cached)
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Restore source firmware extraction cache
        id: cache-source-fw
        uses: actions/cache/restore@v4
        with:
          path: out/fw/SM-S911B_EUX
          key: source-fw-${{ matrix.target }}-S911BXXSAEYI1

      - name: Restore source firmware download marker
        if: steps.cache-source-fw.outputs.cache-hit == 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          mkdir -p "$ODIN_DIR/SM-S911B_EUX"
          echo "S911BXXSAEYI1/S911BOXMAEYI1/S911BXXSAEYI1" > "$ODIN_DIR/SM-S911B_EUX/.downloaded"

      - name: Download source firmware (SM-S911B / S23 - One UI 7)
        if: steps.cache-source-fw.outputs.cache-hit != 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          DEST="$ODIN_DIR/SM-S911B_EUX"
          mkdir -p "$DEST"
          THREADS=8
          for i in 1 2 3 4 5; do
            rm -rf "$DEST" && mkdir -p "$DEST"
            samloader download -m "SM-S911B" -r "EUX" \
              -v "S911BXXSAEYI1" \
              -d "$DEST" && break
            echo "Tentativa $i falhou..."
            [ "$THREADS" -gt 1 ] && THREADS=$(( THREADS / 2 ))
            sleep 10
          done
          ZIP=$(find "$DEST" -maxdepth 1 -name "*.zip" | head -1)
          [ -z "$ZIP" ] && echo "Download falhou" && exit 1
          unzip -o "$ZIP" -d "$DEST" && rm -f "$ZIP"
          AP=$(find  "$DEST" -maxdepth 1 -name "AP_*.tar.md5"  | head -1 | xargs -I{} basename {})
          CSC=$(find "$DEST" -maxdepth 1 \( -name "CSC_*.tar.md5" -o -name "HOME_CSC_*.tar.md5" \) | head -1 | xargs -I{} basename {})
          CP=$(find  "$DEST" -maxdepth 1 -name "CP_*.tar.md5"  | head -1 | xargs -I{} basename {})
          echo "${AP}/${CSC}/${CP}" > "$DEST/.downloaded"
          echo "Marker: $(cat $DEST/.downloaded)"

      - name: Extract source firmware
        if: steps.cache-source-fw.outputs.cache-hit != 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --ignore-target

      - name: Save source firmware extraction cache
        if: steps.cache-source-fw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/fw/SM-S911B_EUX
          key: source-fw-${{ matrix.target }}-S911BXXSAEYI1

      - name: Restore target firmware extraction cache
        id: cache-target-fw
        uses: actions/cache/restore@v4
        with:
          path: out/fw/SM-A528B_BTU
          key: target-fw-${{ matrix.target }}-A528BXXSBGYI3

      - name: Restore target firmware download marker
        if: steps.cache-target-fw.outputs.cache-hit == 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          mkdir -p "$ODIN_DIR/SM-A528B_BTU"
          echo "A528BXXSBGYI3/A528BOXMBGYI3/A528BXXSBGYI3" > "$ODIN_DIR/SM-A528B_BTU/.downloaded"

      - name: Download target firmware (SM-A528B / A52s)
        if: steps.cache-target-fw.outputs.cache-hit != 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          DEST="$ODIN_DIR/SM-A528B_BTU"
          mkdir -p "$DEST"
          THREADS=8
          for i in 1 2 3 4 5; do
            rm -rf "$DEST" && mkdir -p "$DEST"
            samloader download -m "SM-A528B" -r "BTU" \
              -v "A528BXXSBGYI3" \
              -d "$DEST" && break
            echo "Tentativa $i falhou..."
            [ "$THREADS" -gt 1 ] && THREADS=$(( THREADS / 2 ))
            sleep 10
          done
          ZIP=$(find "$DEST" -maxdepth 1 -name "*.zip" | head -1)
          [ -z "$ZIP" ] && echo "Download falhou" && exit 1
          unzip -o "$ZIP" -d "$DEST" && rm -f "$ZIP"
          AP=$(find  "$DEST" -maxdepth 1 -name "AP_*.tar.md5"  | head -1 | xargs -I{} basename {})
          CSC=$(find "$DEST" -maxdepth 1 \( -name "CSC_*.tar.md5" -o -name "HOME_CSC_*.tar.md5" \) | head -1 | xargs -I{} basename {})
          CP=$(find  "$DEST" -maxdepth 1 -name "CP_*.tar.md5"  | head -1 | xargs -I{} basename {})
          echo "${AP}/${CSC}/${CP}" > "$DEST/.downloaded"
          echo "Marker: $(cat $DEST/.downloaded)"

      - name: Extract target firmware
        if: steps.cache-target-fw.outputs.cache-hit != 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --ignore-source

      - name: Save target firmware extraction cache
        if: steps.cache-target-fw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/fw/SM-A528B_BTU
          key: target-fw-${{ matrix.target }}-A528BXXSBGYI3

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh

      - name: Upload to GoFile
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -name "*.zip" | head -1)
          [ -z "$ZIP_FILE" ] && echo "Nenhum ZIP encontrado" && exit 1
          SERVER=$(curl -s "https://api.gofile.io/servers" | jq -r '.data.servers[0].name')
          RESPONSE=$(curl -s -F "file=@${ZIP_FILE}" \
            -F "token=${{ secrets.GOFILE_TOKEN }}" \
            -F "folderId=${{ secrets.GOFILE_FOLDER_ID }}" \
            "https://${SERVER}.gofile.io/contents/uploadfile")
          echo "Link: $(echo "$RESPONSE" | jq -r '.data.downloadPage')"

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ROM-a52sxq
          path: out/*.zip
          retention-days: 7
