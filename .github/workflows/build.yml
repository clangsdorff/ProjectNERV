name: Build ProjectNERV

on:
  workflow_dispatch:
  push:
    branches:
      - 'fifteen'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configurar Ambiente
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libssl-dev pkg-config clang cmake ccache erofs-utils
          
          # Baixa o binário pré-compilado do samloader-rs (versão estável)
          mkdir -p $HOME/.local/bin
          # Usando a URL direta do binário para evitar problemas com o tar
          curl -L "https://github.com/luisbocanegra/samloader-rs/releases/download/v1.2.0/samloader-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/samloader.tar.gz
          tar -xzf /tmp/samloader.tar.gz -C $HOME/.local/bin/
          chmod +x $HOME/.local/bin/samloader

      - name: Ajustar Configurações (A52s)
        run: |
          # Garante que o projeto use o modelo correto
          find . -name "*.sh" -exec sed -i 's/SM-S911B/SM-S711B/g' {} +
          
          # Injeta IMEIs de teste para o extrator
          sed -i 's|SOURCE_FIRMWARE=.*|SOURCE_FIRMWARE="SM-S711B/EUX/352404911234563"|' target/a52sxq/config.sh
          sed -i 's|TARGET_FIRMWARE=.*|TARGET_FIRMWARE="SM-A528B/BTU/352599501234566"|' target/a52sxq/config.sh

      - name: Configurar Wrapper do Samloader (Interceptador)
        run: |
          mkdir -p $HOME/custom_bin
          cat << 'EOF' > $HOME/custom_bin/samloader
          #!/bin/bash
          # Simula a resposta do check-update para evitar timeouts
          if [[ "$*" == *"check-update"* ]] || [[ "$*" == *"checkupdate"* ]]; then
            if [[ "$*" == *"SM-S711B"* ]]; then
              echo "S711BXXSAEYI1/S711BOXMAEYI1/S711BXXSAEYI1"
              exit 0
            elif [[ "$*" == *"SM-A528B"* ]]; then
              echo "A528BXXSBGYI3/A528BOXMBGYI3/A528BXXSBGYI3"
              exit 0
            fi
          fi
          # Executa o samloader real com retry
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            $HOME/.local/bin/samloader "$@" && exit 0
            echo "Tentativa $i falhou. Reiniciando em 15s..."
            sleep 15
          done
          exit 1
          EOF
          chmod +x $HOME/custom_bin/samloader
          echo "$HOME/custom_bin" >> $GITHUB_PATH

      - name: Build ProjectNERV
        run: |
          # Bypass da compilação do erofs-utils (usa o do sistema Ubuntu)
          mkdir -p bin
          ln -sf /usr/bin/mkfs.erofs bin/mkfs.erofs
          ln -sf /usr/bin/extract.erofs bin/extract.erofs
          
          chmod +x buildenv.sh
          ./buildenv.sh ${{ matrix.target }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProjectNERV-${{ matrix.target }}
          path: out/*.zip
