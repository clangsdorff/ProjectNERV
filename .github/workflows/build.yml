name: Build ProjectNERV

on:
  workflow_dispatch:
  push:
    branches:
      - 'fifteen'
  pull_request:
    branches:
      - 'fifteen'
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configurar Ambiente
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential zip curl libssl-dev pkg-config clang cmake ccache \
            erofs-utils ffmpeg pcre2-utils protobuf-compiler \
            p7zip-full lz4 zstd brotli default-jdk jq vim-common unzip \
            webp libwebp-dev libfuse2 python3-pip python3-venv

          sudo apt-get install -y libattr1-dev || true
          sudo apt-get install -y libfuse-dev || true
          
          # Baixa e extrai o samloader-rs
          mkdir -p $HOME/.local/bin
          mkdir -p /tmp/samloader_extract
          curl -L "https://github.com/topjohnwu/samloader-rs/releases/download/1.2.0/samloader-linux-x86_64.tar.xz" -o /tmp/samloader.tar.xz
          tar -xf /tmp/samloader.tar.xz -C /tmp/samloader_extract/
          
          # Move o binário para o local correto
          find /tmp/samloader_extract/ -type f -name "samloader" -exec mv {} $HOME/.local/bin/ \;
          chmod +x $HOME/.local/bin/samloader
          rm -rf /tmp/samloader_extract /tmp/samloader.tar.xz

      - name: Ajustar Configurações (A52s )
        run: |
          # Garante que o projeto use o modelo correto
          find . -name "*.sh" -exec sed -i 's/SM-S911B/SM-S711B/g' {} +
          
          # Injeta IMEIs de teste para o extrator
          sed -i 's|SOURCE_FIRMWARE=.*|SOURCE_FIRMWARE="SM-S711B/EUX/352404911234563"|' target/a52sxq/config.sh
          sed -i 's|TARGET_FIRMWARE=.*|TARGET_FIRMWARE="SM-A528B/BTU/352599501234566"|' target/a52sxq/config.sh

      - name: Configurar Wrapper do Samloader (Interceptador)
        run: |
          mkdir -p $HOME/custom_bin
          cat << 'EOF' > $HOME/custom_bin/samloader
          #!/bin/bash
          if [[ "$*" == *"check-update"* ]] || [[ "$*" == *"checkupdate"* ]]; then
            if [[ "$*" == *"SM-S711B"* ]]; then
              echo "S711BXXSAEYI1/S711BOXMAEYI1/S711BXXSAEYI1"
              exit 0
            elif [[ "$*" == *"SM-A528B"* ]]; then
              echo "A528BXXSBGYI3/A528BOXMBGYI3/A528BXXSBGYI3"
              exit 0
            fi
          fi
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            $HOME/.local/bin/samloader "$@" && exit 0
            echo "Tentativa $i falhou. Reiniciando em 15s..."
            sleep 15
          done
          exit 1
          EOF
          chmod +x $HOME/custom_bin/samloader
          echo "$HOME/custom_bin" >> $GITHUB_PATH

      - name: Init submodules
        run: |
          git submodule sync --recursive || true
          git submodule update --init --recursive || true
          git submodule foreach --recursive 'git reset --hard || true'

      - name: Build required tools
        run: |
          chmod +x scripts/build_dependencies.sh
          ./scripts/build_dependencies.sh || true

      - name: Build ProjectNERV
        continue-on-error: true
        run: |
          # Bypass da compilação do erofs-utils
          mkdir -p bin
          ln -sf /usr/bin/mkfs.erofs bin/mkfs.erofs
          ln -sf /usr/bin/extract.erofs bin/extract.erofs
          
          # Importante: O buildenv.sh deve ser carregado com 'source'
          chmod +x buildenv.sh
          source ./buildenv.sh ${{ matrix.target }}
          
          # Inicia o build da ROM
          chmod +x scripts/make_rom.sh
          ./scripts/make_rom.sh --force

      - name: Collect build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: projectnerv-logs-${{ matrix.target }}
          path: |
            out/*.log
            out/**/*.log
            out/*-*.log

      - name: Upload Artifact
        if: always()
        run: |
          echo "Listing output directory..."
          find out -maxdepth 2 -type f | sort || true
          if ls out/*.zip >/dev/null 2>&1; then
            echo "Found ROM zip artifacts"
          else
            echo "No ROM zip artifact found"
            exit 0
          fi

      - name: Upload ROM ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProjectNERV-${{ matrix.target }}
          path: out/*.zip
