name: Build ProjectNERV

on:
  workflow_dispatch:
  push:
    branches:
      - 'fifteen'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Ajustar Configurações (S23 FE + IMEIs de Validação)
        run: |
          # Garante que todo o projeto use o modelo S23 FE (S711B)
          find . -name "*.sh" -exec sed -i 's/SM-S911B/SM-S711B/g' {} +
          
          # Injeta IMEIs de 15 dígitos para passar no 'regex' do extract_fw.sh
          # O script de extração EXIGE 15 números para não dar erro de "No valid IMEI"
          sed -i 's|SOURCE_FIRMWARE=.*|SOURCE_FIRMWARE="SM-S711B/EUX/352404911234563"|' target/a52sxq/config.sh
          sed -i 's|TARGET_FIRMWARE=.*|TARGET_FIRMWARE="SM-A528B/BTU/352599501234566"|' target/a52sxq/config.sh
          
          if [ -f "unica/configs/qssi.sh" ]; then
            sed -i 's|SOURCE_FIRMWARE=.*|SOURCE_FIRMWARE="SM-S711B/EUX/352404911234563"|' unica/configs/qssi.sh
          fi

      - name: Remover submodules fantasma
        run: |
          git rm --cached -f target/a53x/patches/vendor 2>/dev/null || true
          git rm --cached -f target/m34x/patches/vendor 2>/dev/null || true
          git rm --cached -f external/samloader 2>/dev/null || true
          git submodule update --init

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev \
            libpcre2-dev libzstd-dev lld protobuf-compiler \
            curl xxd patchelf flex bison lz4 libarchive-tools \
            build-essential python3 python3-pip python3-venv \
            device-tree-compiler android-sdk-libsparse-utils adb fastboot \
            e2fsprogs webp pcre2-utils

      - name: Instalar Rust e compilar samloader-rs
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          git clone https://github.com/topjohnwu/samloader-rs.git /tmp/samloader-rs
          cd /tmp/samloader-rs && git checkout 1.2.0
          patch -p3 < "${{ github.workspace }}/patches/samloader-rs/0001-version-select.patch"
          cargo build --release
          cp target/release/samloader $HOME/.cargo/bin/samloader

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar ferramentas e Magiskboot
        run: |
          mkdir -p out/tools/bin out/tools/venv/bin
          ln -sf $(which simg2img) out/tools/bin/simg2img
          ln -sf $(which img2simg) out/tools/bin/img2simg
          ln -sf $(which mke2fs)   out/tools/bin/mke2fs
          ln -sf $(which e2fsdroid) out/tools/bin/e2fsdroid
          
          MAGISK_URL=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest | jq -r '.assets[] | .browser_download_url' | grep "Magisk-v.*\.apk$")
          curl -L -s -o /tmp/magisk.apk "$MAGISK_URL"
          unzip -q -j /tmp/magisk.apk "lib/x86_64/libmagiskboot.so" -d /tmp/
          mv /tmp/libmagiskboot.so out/tools/bin/magiskboot
          chmod +x out/tools/bin/magiskboot
          ln -sf $HOME/.cargo/bin/samloader out/tools/venv/bin/samloader

      - name: Build dependencies
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download Firmwares (S23 FE + A52s)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          SAMLOADER="$HOME/.cargo/bin/samloader"
          
          # 1. SOURCE (S23 FE)
          DEST_S="$ODIN_DIR/SM-S711B_EUX"
          mkdir -p "$DEST_S" && cd "$DEST_S"
          $SAMLOADER download -m "SM-S711B" -r "EUX" -v "S711BXXSAEYI1/S711BOXMAEYI1/S711BXXSAEYI1"
          unzip -o *.zip && rm -f *.zip
          
          AP_S=$(find . -name "AP_*.tar.md5" | head -1 | xargs basename)
          CSC_S=$(find . \( -name "CSC_*.tar.md5" -o -name "HOME_CSC_*.tar.md5" \) | head -1 | xargs basename)
          CP_S=$(find . -name "CP_*.tar.md5" | head -1 | xargs basename)
          echo "${AP_S}/${CSC_S}/${CP_S}" > ".downloaded"
          cd ../../..

          # 2. TARGET (A52s)
          DEST_T="$ODIN_DIR/SM-A528B_BTU"
          mkdir -p "$DEST_T" && cd "$DEST_T"
          $SAMLOADER download -m "SM-A528B" -r "BTU" -v "A528BXXSBGYI3/A528BOXMBGYI3/A528BXXSBGYI3" || $SAMLOADER download -m "SM-A528B" -r "BTU"
          unzip -o *.zip && rm -f *.zip
          
          AP_T=$(find . -name "AP_*.tar.md5" | head -1 | xargs basename)
          CSC_T=$(find . \( -name "CSC_*.tar.md5" -o -name "HOME_CSC_*.tar.md5" \) | head -1 | xargs basename)
          CP_T=$(find . -name "CP_*.tar.md5" | head -1 | xargs basename)
          echo "${AP_T}/${CSC_T}/${CP_T}" > ".downloaded"
          cd ../../..

      - name: Extract and Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          export SKIP_DEPENDENCY_CHECK=1
          
          # Força as variáveis corretas no ambiente do shell para o extrator
          export SOURCE_FIRMWARE="SM-S711B/EUX/352404911234563"
          export TARGET_FIRMWARE="SM-A528B/BTU/352599501234566"
          
          ./scripts/extract_fw.sh --ignore-target
          ./scripts/extract_fw.sh --ignore-source
          bash ./scripts/make_rom.sh

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROM-A52s
          path: out/*.zip
