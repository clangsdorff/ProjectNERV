name: Build ProjectNERV

on:
  workflow_dispatch:
  push:
    branches:
      - 'fifteen'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Debug e Correção de Estrutura
        run: |
          echo "=== Verificando target/a52sxq/config.sh ==="
          cat target/a52sxq/config.sh 2>/dev/null || echo "ARQUIVO NÃO EXISTE"
          
          echo "=== Verificando unica/configs/qssi.sh (Provável culpado) ==="
          cat unica/configs/qssi.sh 2>/dev/null || echo "ARQUIVO NÃO EXISTE"

          # Correção agressiva: Força o SOURCE_FIRMWARE em qualquer config global
          find unica/configs/ -name "*.sh" -exec sed -i 's/SM-S911B/SM-S711B/g' {} +
          find unica/configs/ -name "*.sh" -exec sed -i 's/352404911234563/S711BXXSAEYI1/g' {} +

      - name: Remover submodules fantasma
        run: |
          git rm --cached -f target/a53x/patches/vendor 2>/dev/null || true
          git rm --cached -f target/m34x/patches/vendor 2>/dev/null || true
          git rm --cached -f external/samloader 2>/dev/null || true
          git submodule update --init

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev \
            libpcre2-dev libzstd-dev lld protobuf-compiler \
            curl xxd patchelf flex bison lz4 libarchive-tools \
            build-essential python3 python3-pip python3-venv \
            device-tree-compiler android-sdk-libsparse-utils adb fastboot \
            e2fsprogs

      - name: Instalar Rust e samloader-rs
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          cargo install samloader
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Patch build_dependencies.sh (Flags False)
        run: |
          sed -i 's/^ANDROID_TOOLS=true$/ANDROID_TOOLS=false/' scripts/build_dependencies.sh
          sed -i 's/^APKTOOL=true$/APKTOOL=false/'             scripts/build_dependencies.sh
          sed -i 's/^EROFS_UTILS=true$/EROFS_UTILS=false/'     scripts/build_dependencies.sh
          sed -i 's/^IMG2SDAT=true$/IMG2SDAT=false/'           scripts/build_dependencies.sh
          sed -i 's/^MAGISKBOOT=true$/MAGISKBOOT=false/'       scripts/build_dependencies.sh
          sed -i 's/^SAMLOADER=true$/SAMLOADER=false/'        scripts/build_dependencies.sh
          sed -i 's/^SIGNAPK=true$/SIGNAPK=false/'            scripts/build_dependencies.sh

      - name: Criar links para binários e Magiskboot
        run: |
          mkdir -p out/tools/bin out/tools/venv/bin
          ln -sf $(which simg2img) out/tools/bin/simg2img
          ln -sf $(which img2simg) out/tools/bin/img2simg
          ln -sf $(which mke2fs)   out/tools/bin/mke2fs
          ln -sf $(which e2fsdroid) out/tools/bin/e2fsdroid
          MAGISK_URL=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest | jq -r '.assets[] | .browser_download_url' | grep "Magisk-v.*\.apk$")
          curl -L -s -o /tmp/magisk.apk "$MAGISK_URL"
          unzip -q -j /tmp/magisk.apk "lib/x86_64/libmagiskboot.so" -d /tmp/
          mv /tmp/libmagiskboot.so out/tools/bin/magiskboot
          chmod +x out/tools/bin/magiskboot

      - name: Download firmware SOURCE (S23 FE)
        run: |
          # Tentamos SM-S711B / EUX / S711BXXSAEYI1
          MODEL="SM-S711B"
          REGION="EUX"
          VERSION="S711BXXSAEYI1"
          DEST="out/odin/${MODEL}_${REGION}"
          mkdir -p "$DEST"
          samloader download -m "$MODEL" -r "$REGION" -v "$VERSION" -d "$DEST"
          ZIP=$(find "$DEST" -maxdepth 1 -name "*.zip" | head -1)
          unzip -o "$ZIP" -d "$DEST" && rm -f "$ZIP"
          AP=$(find "$DEST" -name "AP_*.tar.md5" | head -1 | xargs basename)
          CSC=$(find "$DEST" -name "CSC_*.tar.md5" | head -1 | xargs basename)
          CP=$(find "$DEST" -name "CP_*.tar.md5" | head -1 | xargs basename)
          echo "${AP}/${CSC}/${CP}" > "$DEST/.downloaded"

      - name: Download firmware TARGET (A52s)
        run: |
          MODEL="SM-A528B"
          REGION="BTU"
          VERSION="A528BXXSBGYI3"
          DEST="out/odin/${MODEL}_${REGION}"
          mkdir -p "$DEST"
          samloader download -m "$MODEL" -r "$REGION" -v "$VERSION" -d "$DEST"
          ZIP=$(find "$DEST" -maxdepth 1 -name "*.zip" | head -1)
          unzip -o "$ZIP" -d "$DEST" && rm -f "$ZIP"
          AP=$(find "$DEST" -name "AP_*.tar.md5" | head -1 | xargs basename)
          CSC=$(find "$DEST" -name "CSC_*.tar.md5" | head -1 | xargs basename)
          CP=$(find "$DEST" -name "CP_*.tar.md5" | head -1 | xargs basename)
          echo "${AP}/${CSC}/${CP}" > "$DEST/.downloaded"

      - name: Extract and Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          export SKIP_DEPENDENCY_CHECK=1
          # Garante que o source firmware está correto no ambiente antes de extrair
          export SOURCE_FIRMWARE="SM-S711B/EUX/S711BXXSAEYI1"
          ./scripts/extract_fw.sh --ignore-target
          ./scripts/extract_fw.sh --ignore-source
          bash ./scripts/make_rom.sh

      - name: Upload para GoFile
        if: always()
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            SERVER=$(curl -s "https://api.gofile.io/servers" | jq -r '.data.servers[0].name')
            RESPONSE=$(curl -s -F "file=@${ZIP_FILE}" "https://${SERVER}.gofile.io/contents/uploadfile")
            echo "Link: $(echo "$RESPONSE" | jq -r '.data.downloadPage')"
          fi

      - name: Salvar artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ROM-A52s-Final
          path: out/*.zip
