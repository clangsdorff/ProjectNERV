name: Build ProjectNERV

on:
  workflow_dispatch:
  push:
    branches:
      - 'fifteen'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Ajustar Configurações (S23 FE Version)
        run: |
          # Garante o modelo S23 FE e as versões reais nas configs
          find . -name "*.sh" -exec sed -i 's/SM-S911B/SM-S711B/g' {} +
          find . -name "*.sh" -exec sed -i 's/352404911234563/S711BXXSAEYI1/g' {} +
          find . -name "*.sh" -exec sed -i 's/352599501234566/A528BXXSBGYI3/g' {} +

      - name: Remover submodules fantasma
        run: |
          git rm --cached -f target/a53x/patches/vendor 2>/dev/null || true
          git rm --cached -f target/m34x/patches/vendor 2>/dev/null || true
          git rm --cached -f external/samloader 2>/dev/null || true
          git submodule update --init

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev \
            libpcre2-dev libzstd-dev lld protobuf-compiler \
            curl xxd patchelf flex bison lz4 libarchive-tools \
            build-essential python3 python3-pip python3-venv \
            device-tree-compiler android-sdk-libsparse-utils adb fastboot \
            e2fsprogs webp pcre2-utils

      - name: Instalar Rust e compilar samloader-rs
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          git clone https://github.com/topjohnwu/samloader-rs.git /tmp/samloader-rs
          cd /tmp/samloader-rs && git checkout 1.2.0
          patch -p3 < "${{ github.workspace }}/patches/samloader-rs/0001-version-select.patch"
          cargo build --release
          cp target/release/samloader $HOME/.cargo/bin/samloader

      - name: Bypass build de ferramentas
        run: |
          # Usa as ferramentas que já temos no sistema
          sed -i 's/^ANDROID_TOOLS=true$/ANDROID_TOOLS=false/' scripts/build_dependencies.sh
          sed -i 's/^APKTOOL=true$/APKTOOL=false/'             scripts/build_dependencies.sh
          sed -i 's/^SAMLOADER=true$/SAMLOADER=false/'        scripts/build_dependencies.sh
          sed -i 's/^SIGNAPK=true$/SIGNAPK=false/'            scripts/build_dependencies.sh
          
          mkdir -p out/tools/bin out/tools/venv/bin
          ln -sf $(which simg2img) out/tools/bin/simg2img
          ln -sf $(which img2simg) out/tools/bin/img2simg
          ln -sf $(which mke2fs)   out/tools/bin/mke2fs
          ln -sf $(which e2fsdroid) out/tools/bin/e2fsdroid
          
          MAGISK_URL=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest | jq -r '.assets[] | .browser_download_url' | grep "Magisk-v.*\.apk$")
          curl -L -s -o /tmp/magisk.apk "$MAGISK_URL"
          unzip -q -j /tmp/magisk.apk "lib/x86_64/libmagiskboot.so" -d /tmp/
          mv /tmp/libmagiskboot.so out/tools/bin/magiskboot
          chmod +x out/tools/bin/magiskboot
          ln -sf $HOME/.cargo/bin/samloader out/tools/venv/bin/samloader

      - name: Build dependencies
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download firmware SOURCE (S23 FE - One UI 7)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          SAMLOADER="$HOME/.cargo/bin/samloader"
          DEST="$ODIN_DIR/SM-S711B_EUX"
          mkdir -p "$DEST"
          cd "$DEST"
          
          # Download com string completa
          $SAMLOADER download -m "SM-S711B" -r "EUX" -v "S711BXXSAEYI1/S711BOXMAEYI1/S711BXXSAEYI1" -d "."
          
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          unzip -o "$ZIP" && rm -f "$ZIP"
          
          AP=$(find . -name "AP_*.tar.md5" | head -1 | xargs basename)
          CSC=$(find . \( -name "CSC_*.tar.md5" -o -name "HOME_CSC_*.tar.md5" \) | head -1 | xargs basename)
          CP=$(find . -name "CP_*.tar.md5" | head -1 | xargs basename)
          BL=$(find . -name "BL_*.tar.md5" | head -1 | xargs basename)
          
          # Marker no formato AP/CSC/CP/BL
          echo "${AP}/${CSC}/${CP}/${BL}" > ".downloaded"

      - name: Download firmware TARGET (A52s)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          SAMLOADER="$HOME/.cargo/bin/samloader"
          DEST="$ODIN_DIR/SM-A528B_BTU"
          mkdir -p "$DEST"
          cd "$DEST"
          
          $SAMLOADER download -m "SM-A528B" -r "BTU" -v "A528BXXSBGYI3/A528BOXMBGYI3/A528BXXSBGYI3" -d "." || $SAMLOADER download -m "SM-A528B" -r "BTU" -d "."
          
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          unzip -o "$ZIP" && rm -f "$ZIP"
          
          AP=$(find . -name "AP_*.tar.md5" | head -1 | xargs basename)
          CSC=$(find . \( -name "CSC_*.tar.md5" -o -name "HOME_CSC_*.tar.md5" \) | head -1 | xargs basename)
          CP=$(find . -name "CP_*.tar.md5" | head -1 | xargs basename)
          BL=$(find . -name "BL_*.tar.md5" | head -1 | xargs basename)
          echo "${AP}/${CSC}/${CP}/${BL}" > ".downloaded"

      - name: Extract and Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          export SKIP_DEPENDENCY_CHECK=1
          # Passa as versões reais para o ambiente
          export SOURCE_FIRMWARE="SM-S711B/EUX/S711BXXSAEYI1"
          export TARGET_FIRMWARE="SM-A528B/BTU/A528BXXSBGYI3"
          
          ./scripts/extract_fw.sh --ignore-target
          ./scripts/extract_fw.sh --ignore-source
          bash ./scripts/make_rom.sh

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProjectNERV-A52s-OneUI7
          path: out/*.zip
