name: Build ProjectNERV

on:
  workflow_dispatch:
  push:
    branches:
      - 'fifteen'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Remover submodules fantasma do índice git
        run: |
          git rm --cached -f target/a53x/patches/vendor 2>/dev/null || true
          git rm --cached -f target/m34x/patches/vendor 2>/dev/null || true
          git rm --cached -f external/samloader 2>/dev/null || true
          git submodule update --init

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev \
            libpcre2-dev libzstd-dev lld protobuf-compiler \
            curl xxd patchelf flex bison lz4 libarchive-tools \
            build-essential python3 python3-pip python3-venv \
            device-tree-compiler android-sdk-libsparse-utils adb fastboot \
            e2fsprogs

      - name: Instalar Rust e samloader-rs
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          cargo install samloader

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pré-popular out/tools/bin para enganar CHECK_TOOLS
        run: |
          mkdir -p out/tools/bin/gki out/tools/venv/bin

          # Binários reais do sistema
          for bin in adb fastboot simg2img img2simg; do
            BIN_PATH=$(which $bin 2>/dev/null) \
              && ln -sf "$BIN_PATH" out/tools/bin/$bin || true
          done

          ln -sf $(which mke2fs)    out/tools/bin/mke2fs.android 2>/dev/null || true
          ln -sf $(which mke2fs)    out/tools/bin/mke2fs         2>/dev/null || true
          ln -sf $(which e2fsdroid) out/tools/bin/e2fsdroid      2>/dev/null || true

          # Stubs para o resto (CHECK_TOOLS só checa se o arquivo existe)
          for stub in append2simg avbtool fec lpadd lpdump lpflash lpmake lpunpack \
                      make_f2fs mkbootfs mkbootimg mkdtboimg mke2fs.conf mkf2fsuserimg \
                      mkuserimg_mke2fs repack_bootimg sload_f2fs unpack_bootimg zipalign \
                      ext2simg; do
            printf '#!/bin/sh\ntrue\n' > "out/tools/bin/$stub"
            chmod +x "out/tools/bin/$stub"
          done
          printf '#!/bin/sh\ntrue\n' > "out/tools/bin/gki/generate_gki_certificate.py"
          chmod +x "out/tools/bin/gki/generate_gki_certificate.py"

          # apktool
          touch out/tools/bin/apktool.jar
          printf '#!/bin/sh\ntrue\n' > out/tools/bin/apktool
          chmod +x out/tools/bin/apktool

          # magiskboot — baixar do Magisk APK (igual ao script original)
          MAGISK_URL=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            | jq -r '.assets[] | .browser_download_url' | grep "Magisk-v.*\.apk$")
          curl -L -s -o /tmp/magisk.apk "$MAGISK_URL"
          unzip -q -j /tmp/magisk.apk "lib/x86_64/libmagiskboot.so" -d /tmp/
          mv /tmp/libmagiskboot.so out/tools/bin/magiskboot
          chmod +x out/tools/bin/magiskboot

          # samloader — symlink do cargo para o path que o script checa
          source $HOME/.cargo/env
          ln -sf $HOME/.cargo/bin/samloader out/tools/venv/bin/samloader

          # signapk — stubs
          touch out/tools/bin/signapk.jar
          printf '#!/bin/sh\ntrue\n' > out/tools/bin/signapk
          chmod +x out/tools/bin/signapk

          echo "=== out/tools/bin ==="
          ls -la out/tools/bin/

      - name: Build dependencies (deve pular tudo via CHECK_TOOLS)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download firmware SOURCE (SM-S711B / S23 FE)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          source $HOME/.cargo/env
          MODEL="SM-S711B"
          REGION="EUX"
          VERSION="S711BXXSAEYI1"
          DEST="$ODIN_DIR/${MODEL}_${REGION}"
          mkdir -p "$DEST"

          for i in 1 2 3 4 5; do
            echo "Tentativa $i..."
            samloader download -m "$MODEL" -r "$REGION" -v "$VERSION" -o "$DEST" \
              && break || sleep 20
          done

          ZIP=$(find "$DEST" -maxdepth 1 -name "*.zip" | head -1)
          [ -z "$ZIP" ] && echo "ZIP não encontrado" && exit 1
          unzip -o "$ZIP" -d "$DEST" && rm -f "$ZIP"

          AP=$(find  "$DEST" -maxdepth 1 -name "AP_*.tar.md5"  | head -1 | xargs -I{} basename {})
          CSC=$(find "$DEST" -maxdepth 1 \( -name "CSC_*.tar.md5" -o -name "HOME_CSC_*.tar.md5" \) | head -1 | xargs -I{} basename {})
          CP=$(find  "$DEST" -maxdepth 1 -name "CP_*.tar.md5"  | head -1 | xargs -I{} basename {})
          echo "${AP}/${CSC}/${CP}" > "$DEST/.downloaded"
          echo "Marker: $(cat $DEST/.downloaded)"

      - name: Download firmware TARGET (SM-A528B / A52s)
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          source $HOME/.cargo/env
          MODEL="SM-A528B"
          REGION="BTU"
          VERSION="A528BXXSBGYI3"
          DEST="$ODIN_DIR/${MODEL}_${REGION}"
          mkdir -p "$DEST"

          for i in 1 2 3 4 5; do
            echo "Tentativa $i..."
            samloader download -m "$MODEL" -r "$REGION" -v "$VERSION" -o "$DEST" \
              && break || sleep 20
          done

          ZIP=$(find "$DEST" -maxdepth 1 -name "*.zip" | head -1)
          [ -z "$ZIP" ] && echo "ZIP não encontrado" && exit 1
          unzip -o "$ZIP" -d "$DEST" && rm -f "$ZIP"

          AP=$(find  "$DEST" -maxdepth 1 -name "AP_*.tar.md5"  | head -1 | xargs -I{} basename {})
          CSC=$(find "$DEST" -maxdepth 1 \( -name "CSC_*.tar.md5" -o -name "HOME_CSC_*.tar.md5" \) | head -1 | xargs -I{} basename {})
          CP=$(find  "$DEST" -maxdepth 1 -name "CP_*.tar.md5"  | head -1 | xargs -I{} basename {})
          echo "${AP}/${CSC}/${CP}" > "$DEST/.downloaded"
          echo "Marker: $(cat $DEST/.downloaded)"

      - name: Extract firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          export SKIP_DEPENDENCY_CHECK=1
          ./scripts/extract_fw.sh --ignore-target
          ./scripts/extract_fw.sh --ignore-source

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          export SKIP_DEPENDENCY_CHECK=1
          bash ./scripts/make_rom.sh

      - name: Upload para GoFile
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -name "*.zip" | head -1)
          [ -z "$ZIP_FILE" ] && echo "Nenhum ZIP encontrado" && exit 1
          SERVER=$(curl -s "https://api.gofile.io/servers" | jq -r '.data.servers[0].name')
          RESPONSE=$(curl -s -F "file=@${ZIP_FILE}" \
            "https://${SERVER}.gofile.io/contents/uploadfile")
          echo "Link: $(echo "$RESPONSE" | jq -r '.data.downloadPage')"

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ROM-A52s
          path: out/*.zip
          retention-days: 7
