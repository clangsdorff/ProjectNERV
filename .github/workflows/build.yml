name: Build ProjectNERV

on:
  workflow_dispatch:
  push:
    branches:
      - 'fifteen'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configurar submodules e corrigir erofs-utils
        run: |
          git rm --cached -f target/a53x/patches/vendor 2>/dev/null || true
          git rm --cached -f target/m34x/patches/vendor 2>/dev/null || true
          git rm --cached -f external/samloader 2>/dev/null || true
          git submodule update --init external/erofs-utils external/apktool external/img2sdat external/signapk
          cd external/erofs-utils
          git submodule update --init --recursive
          cd ../..

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev \
            libpcre2-dev libzstd-dev lld protobuf-compiler \
            curl xxd patchelf flex bison lz4 libarchive-tools \
            build-essential python3 python3-pip python3-venv \
            device-tree-compiler android-sdk-libsparse-utils adb fastboot \
            e2fsprogs webp pcre2-utils

      - name: Instalar Rust e compilar samloader-rs
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          git clone https://github.com/topjohnwu/samloader-rs.git /tmp/samloader-rs
          cd /tmp/samloader-rs && git checkout 1.2.0
          patch -p3 < "${{ github.workspace }}/patches/samloader-rs/0001-version-select.patch"
          cargo build --release
          sudo cp target/release/samloader /usr/local/bin/samloader
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Preparar ferramentas extras (Magiskboot)
        run: |
          mkdir -p out/tools/bin out/tools/venv/bin
          # Ferramentas nativas do Ubuntu que o NERV precisa
          ln -sf $(which simg2img) out/tools/bin/simg2img
          ln -sf $(which img2simg) out/tools/bin/img2simg
          ln -sf $(which mke2fs)   out/tools/bin/mke2fs
          ln -sf $(which e2fsdroid) out/tools/bin/e2fsdroid
          
          # Download do Magiskboot binário
          MAGISK_URL=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest | jq -r '.assets[] | .browser_download_url' | grep "Magisk-v.*\.apk$")
          curl -L -s -o /tmp/magisk.apk "$MAGISK_URL"
          unzip -q -j /tmp/magisk.apk "lib/x86_64/libmagiskboot.so" -d /tmp/
          mv /tmp/libmagiskboot.so out/tools/bin/magiskboot
          chmod +x out/tools/bin/magiskboot
          ln -sf /usr/local/bin/samloader out/tools/venv/bin/samloader

      - name: Build dependencies
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download Firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          
          # S23 (Donor One UI 7)
          DEST_S="$ODIN_DIR/SM-S911B_EUX"
          mkdir -p "$DEST_S"
          samloader download -m "SM-S911B" -r "EUX" -d "$DEST_S"
          unzip -o $(find "$DEST_S" -name "*.zip") -d "$DEST_S"
          
          # A52s (Target)
          DEST_T="$ODIN_DIR/SM-A528B_BTU"
          mkdir -p "$DEST_T"
          samloader download -m "SM-A528B" -r "BTU" -v "A528BXXSBGYI3" -d "$DEST_T" || samloader download -m "SM-A528B" -r "BTU" -d "$DEST_T"
          unzip -o $(find "$DEST_T" -name "*.zip") -d "$DEST_T"
          
          # Marcadores .downloaded
          find out/odin/ -name "AP_*.tar.md5" | while read ap; do
            dir=$(dirname "$ap")
            csc=$(find "$dir" \( -name "CSC_*.tar.md5" -o -name "HOME_CSC_*.tar.md5" \) | head -1 | xargs basename)
            cp=$(find "$dir" -name "CP_*.tar.md5" | head -1 | xargs basename)
            echo "$(basename "$ap")/$csc/$cp" > "$dir/.downloaded"
          done

      - name: Extract and Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          export SKIP_DEPENDENCY_CHECK=1
          export SOURCE_FIRMWARE="SM-S911B/EUX/latest"
          ./scripts/extract_fw.sh
          bash ./scripts/make_rom.sh

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProjectNERV-A52s-OneUI7
          path: out/*.zip
